<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaw Resources — Cleaning Compliance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F1;min-height:100vh;color:#111}
.app{max-width:960px;margin:0 auto;padding:0 0 3rem}
.topbar{background:#1A4731;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.topbar-title{color:#fff;font-size:16px;font-weight:600}
.topbar-sub{color:#9FE1CB;font-size:11px;margin-top:2px}
.topbar-right{color:#9FE1CB;font-size:11px;text-align:right}
.content{padding:20px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.metric{background:#fff;border-radius:10px;padding:16px;border:1px solid #e0e8e2}
.metric-label{font-size:11px;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.metric-value{font-size:30px;font-weight:600}
.green{color:#2E7D52}.red{color:#A32D2D}.amber{color:#854F0B}.navy{color:#1A2B4A}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.04em}
.filters select{font-size:13px;padding:8px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#111;min-width:140px}
.refresh-btn{margin-left:auto;padding:9px 18px;border:1.5px solid #1A4731;border-radius:8px;background:#fff;color:#1A4731;font-size:13px;cursor:pointer;font-weight:600;align-self:flex-end}
.refresh-btn:hover{background:#1A4731;color:#fff}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:18px;border:1px solid #e0e8e2}
.card-title{font-size:12px;font-weight:600;color:#1A4731;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px}
.chart-wrap{position:relative;width:100%}
.row-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.row-item:last-child{border-bottom:none}
.prog-wrap{flex:1;margin:0 12px;background:#eee;border-radius:20px;height:7px}
.prog-fill{height:7px;border-radius:20px}
.pct{font-weight:600;min-width:38px;text-align:right;font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-done{background:#EAF3DE;color:#2E7D52}
.badge-nd{background:#FCEBEB;color:#A32D2D}
.badge-ok{background:#E8F4EE;color:#1A4731}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;border-bottom:1px solid #eee;color:#888;font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td{padding:9px 10px;border-bottom:1px solid #f5f5f5;color:#111}
tr:last-child td{border-bottom:none}
.loading{text-align:center;padding:5rem;color:#888;font-size:14px}
.error-box{background:#FCEBEB;color:#A32D2D;padding:16px;border-radius:10px;font-size:13px;line-height:1.8}
.legend{display:flex;gap:14px;margin-bottom:10px;font-size:12px;color:#666;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.ld{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.full-width{margin-bottom:16px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">Shaw Resources — SRHWL</div>
      <div class="topbar-sub">Daily Cleaning Compliance Dashboard · SHAW-CLEAN-D001</div>
    </div>
    <div class="topbar-right" id="last-updated">—</div>
  </div>
  <div class="content">
    <div class="filters">
      <div class="filter-group"><label>Operator</label>
        <select id="f-op" onchange="applyFilter()"><option value="">All operators</option></select>
      </div>
      <div class="filter-group"><label>Shift</label>
        <select id="f-shift" onchange="applyFilter()">
          <option value="">All shifts</option>
          <option value="Day Shift">Day Shift</option>
          <option value="Night Shift">Night Shift</option>
        </select>
      </div>
      <div class="filter-group"><label>Day</label>
        <select id="f-day" onchange="applyFilter()"><option value="">All days</option></select>
      </div>
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </div>
    <div id="main-content"><div class="loading">Connecting to Google Sheets...</div></div>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyZXWdjWfmPlt1ZKFO3kSZaDzWs-iT_89WajsXYQAhdpvdH70ZE4HQ4YvUaYTLj-rU/exec";
let allRows=[];
let CH={};

function cc(v){return v>=80?'green':v>=60?'amber':'red';}
function bc(v){return v>=80?'#2E7D52':v>=60?'#BA7517':'#A32D2D';}

function subs(rows){
  const m={};
  rows.forEach(r=>{
    const k=`${r.DATE}|${r.SHIFT}|${r.OPERATOR}`;
    if(!m[k])m[k]={date:r.DATE,day:r.DAY,shift:r.SHIFT,operator:r.OPERATOR,tasks:[],comp:parseFloat(r.COMPLIANCE)||0};
    m[k].tasks.push(r);
  });
  return Object.values(m);
}

function render(rows){
  const ss=subs(rows);
  const total=ss.length;
  const avg=total===0?0:Math.round(ss.reduce((a,s)=>a+s.comp,0)/total);
  const done=rows.filter(r=>r.STATUS==='Done').length;
  const nd=rows.filter(r=>r.STATUS==='Not Done').length;
  const totalTasks=done+nd;

  // By operator
  const byOp={};
  ss.forEach(s=>{
    if(!byOp[s.operator])byOp[s.operator]={n:0,sum:0};
    byOp[s.operator].n++;byOp[s.operator].sum+=s.comp;
  });

  // By shift
  const byShift={};
  ss.forEach(s=>{
    if(!byShift[s.shift])byShift[s.shift]={n:0,sum:0};
    byShift[s.shift].n++;byShift[s.shift].sum+=s.comp;
  });

  // Missed tasks
  const missed={};
  rows.filter(r=>r.STATUS==='Not Done').forEach(r=>{
    const t=r.TASK.length>55?r.TASK.slice(0,55)+'…':r.TASK;
    missed[t]=(missed[t]||0)+1;
  });
  const topMissed=Object.entries(missed).sort((a,b)=>b[1]-a[1]).slice(0,7);

  // Trend by date + shift
  const trend={};
  ss.forEach(s=>{
    if(!trend[s.date])trend[s.date]={'Day Shift':{n:0,sum:0},'Night Shift':{n:0,sum:0}};
    if(!trend[s.date][s.shift])trend[s.date][s.shift]={n:0,sum:0};
    trend[s.date][s.shift].n++;
    trend[s.date][s.shift].sum+=s.comp;
  });
  const trendDates=Object.keys(trend).sort();
  const dayData=trendDates.map(d=>trend[d]['Day Shift']&&trend[d]['Day Shift'].n>0?Math.round(trend[d]['Day Shift'].sum/trend[d]['Day Shift'].n):null);
  const nightData=trendDates.map(d=>trend[d]['Night Shift']&&trend[d]['Night Shift'].n>0?Math.round(trend[d]['Night Shift'].sum/trend[d]['Night Shift'].n):null);

  // Recent
  const recent=[...ss].reverse().slice(0,6);

  const opLabels=Object.keys(byOp);
  const opVals=opLabels.map(o=>Math.round(byOp[o].sum/byOp[o].n));
  const shLabels=Object.keys(byShift);
  const shVals=shLabels.map(s=>Math.round(byShift[s].sum/byShift[s].n));

  document.getElementById('main-content').innerHTML=`
<div class="metrics">
  <div class="metric"><div class="metric-label">Avg. compliance</div><div class="metric-value ${cc(avg)}">${avg}%</div></div>
  <div class="metric"><div class="metric-label">Shifts submitted</div><div class="metric-value navy">${total}</div></div>
  <div class="metric"><div class="metric-label">Tasks done</div><div class="metric-value green">${done}</div></div>
  <div class="metric"><div class="metric-label">Tasks not done</div><div class="metric-value ${nd>0?'red':'green'}">${nd}</div></div>
  <div class="metric"><div class="metric-label">Completion rate</div><div class="metric-value ${cc(pct(done,totalTasks))}">${pct(done,totalTasks)}%</div></div>
</div>

<div class="full-width card">
  <div class="card-title">Compliance trend by shift</div>
  <div class="legend">
    <span><span class="ld" style="background:#2E7D52"></span>Day Shift</span>
    <span><span class="ld" style="background:#185FA5"></span>Night Shift</span>
  </div>
  <div class="chart-wrap" style="height:220px">
    <canvas id="chart-trend" role="img" aria-label="Compliance trend by shift over time"></canvas>
  </div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-title">Done vs Not Done</div>
    <div class="legend">
      <span><span class="ld" style="background:#2E7D52"></span>Done</span>
      <span><span class="ld" style="background:#A32D2D"></span>Not Done</span>
    </div>
    <div class="chart-wrap" style="height:200px">
      <canvas id="chart-donut" role="img" aria-label="Donut chart done vs not done tasks"></canvas>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Compliance by shift type</div>
    <div style="margin-top:8px">
      ${shLabels.map((s,i)=>`
      <div class="row-item">
        <span style="min-width:90px">${s}</span>
        <div class="prog-wrap"><div class="prog-fill" style="width:${shVals[i]}%;background:${bc(shVals[i])}"></div></div>
        <span class="pct ${cc(shVals[i])}">${shVals[i]}%</span>
      </div>`).join('')}
    </div>
  </div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-title">Compliance by operator</div>
    <div class="chart-wrap" style="height:${Math.max(opLabels.length*46+60,140)}px">
      <canvas id="chart-op" role="img" aria-label="Compliance by operator"></canvas>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Most missed tasks</div>
    ${topMissed.length===0
      ?'<p style="color:#2E7D52;font-size:13px;padding-top:8px">✓ No missed tasks</p>'
      :`<table><thead><tr><th>Task</th><th style="text-align:right">Times</th></tr></thead><tbody>
      ${topMissed.map(([t,n])=>`<tr><td style="font-size:12px">${t}</td><td style="text-align:right"><span class="badge badge-nd">${n}×</span></td></tr>`).join('')}
      </tbody></table>`}
  </div>
</div>

<div class="card">
  <div class="card-title">Recent submissions</div>
  <table><thead><tr><th>Date</th><th>Day</th><th>Shift</th><th>Operator</th><th style="text-align:right">Compliance</th></tr></thead>
  <tbody>
  ${recent.map(s=>`<tr>
    <td>${s.date}</td>
    <td>${s.day}</td>
    <td>${s.shift}</td>
    <td>${s.operator}</td>
    <td style="text-align:right"><span class="badge ${s.comp>=80?'badge-done':'badge-nd'}">${Math.round(s.comp)}%</span></td>
  </tr>`).join('')}
  </tbody></table>
</div>`;

  // Destroy old charts
  ['trend','donut','op'].forEach(k=>{if(CH[k]){CH[k].destroy();delete CH[k];}});

  // Trend chart
  CH['trend']=new Chart(document.getElementById('chart-trend'),{
    type:'line',
    data:{labels:trendDates,datasets:[
      {label:'Day Shift',data:dayData,borderColor:'#2E7D52',backgroundColor:'rgba(46,125,82,0.1)',borderWidth:2.5,pointRadius:5,pointBackgroundColor:'#2E7D52',tension:0.3,spanGaps:true},
      {label:'Night Shift',data:nightData,borderColor:'#185FA5',backgroundColor:'rgba(24,95,165,0.1)',borderWidth:2.5,pointRadius:5,pointBackgroundColor:'#185FA5',tension:0.3,spanGaps:true,borderDash:[6,3]}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.raw}%`}}},
      scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%',font:{size:11}},grid:{color:'rgba(0,0,0,0.05)'}},
              x:{ticks:{font:{size:11}},grid:{display:false}}}}
  });

  // Donut
  CH['donut']=new Chart(document.getElementById('chart-donut'),{
    type:'doughnut',
    data:{labels:['Done','Not Done'],datasets:[{data:[done,nd],backgroundColor:['#2E7D52','#A32D2D'],borderWidth:0,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'68%',
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${c.raw} tasks`}}}}
  });

  // Operator bar
  CH['op']=new Chart(document.getElementById('chart-op'),{
    type:'bar',
    data:{labels:opLabels,datasets:[{label:'%',data:opVals,backgroundColor:opVals.map(bc),borderRadius:5,borderSkipped:false}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw+'%'}}},
      scales:{x:{min:0,max:100,ticks:{callback:v=>v+'%',font:{size:11}},grid:{color:'rgba(0,0,0,0.05)'}},
              y:{ticks:{font:{size:12}}}}}
  });
}

function pct(n,t){return t===0?0:Math.round(n/t*100);}

function applyFilter(){
  const op=document.getElementById('f-op').value;
  const sh=document.getElementById('f-shift').value;
  const day=document.getElementById('f-day').value;
  let rows=[...allRows];
  if(op)rows=rows.filter(r=>r.OPERATOR===op);
  if(sh)rows=rows.filter(r=>r.SHIFT===sh);
  if(day)rows=rows.filter(r=>r.DAY===day);
  render(rows);
}

async function loadData(){
  document.getElementById('main-content').innerHTML='<div class="loading">Connecting to Google Sheets...</div>';
  try{
    const res=await fetch(API);
    const data=await res.json();
    allRows=data;
    const ops=[...new Set(data.map(r=>r.OPERATOR))];
    const days=[...new Set(data.map(r=>r.DAY))];
    document.getElementById('f-op').innerHTML='<option value="">All operators</option>'+ops.map(o=>`<option>${o}</option>`).join('');
    document.getElementById('f-day').innerHTML='<option value="">All days</option>'+days.map(d=>`<option>${d}</option>`).join('');
    document.getElementById('last-updated').textContent='Updated: '+new Date().toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit'});
    render(data);
  }catch(err){
    document.getElementById('main-content').innerHTML=`<div class="error-box">Could not connect to Google Sheets.<br><small>${err.message}</small></div>`;
  }
}

loadData();
</script>
</body>
</html>
