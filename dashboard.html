<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaw Resources — Cleaning Compliance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;min-height:100vh;color:#111}
.app{max-width:900px;margin:0 auto;padding:0 0 3rem}
.topbar{background:#1A4731;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.topbar-title{color:#fff;font-size:16px;font-weight:600}
.topbar-sub{color:#9FE1CB;font-size:11px;margin-top:2px}
.topbar-right{color:#9FE1CB;font-size:12px;text-align:right}
.content{padding:20px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.metric{background:#fff;border-radius:10px;padding:16px;border:1px solid #e8e8e8}
.metric-label{font-size:11px;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.metric-value{font-size:28px;font-weight:600}
.green{color:#2E7D52}
.red{color:#A32D2D}
.amber{color:#854F0B}
.navy{color:#1A2B4A}
.section{background:#fff;border-radius:10px;padding:18px;border:1px solid #e8e8e8;margin-bottom:16px}
.section-title{font-size:13px;font-weight:600;color:#1A4731;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filters select{font-size:13px;padding:8px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#111}
.filters label{font-size:12px;color:#888}
.refresh-btn{margin-left:auto;padding:8px 16px;border:1px solid #1A4731;border-radius:8px;background:#fff;color:#1A4731;font-size:13px;cursor:pointer;font-weight:500}
.refresh-btn:hover{background:#1A4731;color:#fff}
.chart-wrap{position:relative;width:100%}
.legend{display:flex;gap:16px;margin-bottom:10px;font-size:12px;color:#666;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;border-bottom:1px solid #eee;color:#888;font-weight:400;font-size:12px}
td{padding:9px 12px;border-bottom:1px solid #f5f5f5;color:#111}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-done{background:#EAF3DE;color:#2E7D52}
.badge-notdone{background:#FCEBEB;color:#A32D2D}
.loading{text-align:center;padding:4rem;color:#888;font-size:14px}
.error-box{background:#FCEBEB;color:#A32D2D;padding:16px;border-radius:10px;font-size:13px;line-height:1.6}
.prog-bar-wrap{background:#f0f0f0;border-radius:20px;height:8px;margin-top:4px}
.prog-bar-fill{height:8px;border-radius:20px;transition:width 0.3s}
.row-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.row-item:last-child{border-bottom:none}
.pct-label{font-weight:600;min-width:40px;text-align:right}
.last-updated{font-size:11px;color:#888;text-align:right;margin-bottom:16px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">Shaw Resources — SRHWL</div>
      <div class="topbar-sub">Daily Cleaning Compliance Dashboard · SHAW-CLEAN-D001</div>
    </div>
    <div class="topbar-right" id="last-updated">—</div>
  </div>

  <div class="content">
    <div class="filters">
      <div>
        <label>Operator</label><br>
        <select id="f-op" onchange="applyFilter()"><option value="">All operators</option></select>
      </div>
      <div>
        <label>Shift</label><br>
        <select id="f-shift" onchange="applyFilter()">
          <option value="">All shifts</option>
          <option value="Day Shift">Day Shift</option>
          <option value="Night Shift">Night Shift</option>
        </select>
      </div>
      <div>
        <label>Day</label><br>
        <select id="f-day" onchange="applyFilter()"><option value="">All days</option></select>
      </div>
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </div>

    <div id="main-content"><div class="loading">Loading data from Google Sheets...</div></div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyZXWdjWfmPlt1ZKFO3kSZaDzWs-iT_89WajsXYQAhdpvdH70ZE4HQ4YvUaYTLj-rU/exec";
let allRows = [];
let charts = {};

function pct(n,t){return t===0?0:Math.round((n/t)*100);}
function compColor(v){return v>=80?'green':v>=60?'amber':'red';}
function barColor(v){return v>=80?'#2E7D52':v>=60?'#BA7517':'#A32D2D';}

function processSubmissions(rows){
  const map = {};
  rows.forEach(r=>{
    const k = `${r.DATE}|${r.DAY}|${r.SHIFT}|${r.OPERATOR}`;
    if(!map[k]) map[k]={date:r.DATE,day:r.DAY,shift:r.SHIFT,operator:r.OPERATOR,tasks:[],comp:parseFloat(r.COMPLIANCE)||0};
    map[k].tasks.push(r);
  });
  return Object.values(map);
}

function renderAll(rows){
  const subs = processSubmissions(rows);
  const total = subs.length;
  const avgComp = total===0?0:Math.round(subs.reduce((a,s)=>a+s.comp,0)/total);
  const done = rows.filter(r=>r.STATUS==='Done').length;
  const notDone = rows.filter(r=>r.STATUS==='Not Done').length;

  // By operator
  const byOp={};
  subs.forEach(s=>{
    if(!byOp[s.operator])byOp[s.operator]={n:0,sum:0};
    byOp[s.operator].n++;byOp[s.operator].sum+=s.comp;
  });

  // By shift
  const byShift={};
  subs.forEach(s=>{
    if(!byShift[s.shift])byShift[s.shift]={n:0,sum:0};
    byShift[s.shift].n++;byShift[s.shift].sum+=s.comp;
  });

  // Missed tasks
  const missed={};
  rows.filter(r=>r.STATUS==='Not Done').forEach(r=>{
    const t=r.TASK.length>60?r.TASK.slice(0,60)+'…':r.TASK;
    missed[t]=(missed[t]||0)+1;
  });
  const topMissed=Object.entries(missed).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // Recent submissions
  const recent=[...subs].reverse().slice(0,6);

  const opLabels=Object.keys(byOp);
  const opVals=opLabels.map(o=>Math.round(byOp[o].sum/byOp[o].n));
  const shiftLabels=Object.keys(byShift);
  const shiftVals=shiftLabels.map(s=>Math.round(byShift[s].sum/byShift[s].n));

  document.getElementById('main-content').innerHTML=`
<div class="metrics">
  <div class="metric"><div class="metric-label">Avg. compliance</div><div class="metric-value ${compColor(avgComp)}">${avgComp}%</div></div>
  <div class="metric"><div class="metric-label">Shifts submitted</div><div class="metric-value navy">${total}</div></div>
  <div class="metric"><div class="metric-label">Tasks done</div><div class="metric-value green">${done}</div></div>
  <div class="metric"><div class="metric-label">Tasks not done</div><div class="metric-value ${notDone>0?'red':'green'}">${notDone}</div></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
  <div class="section">
    <div class="section-title">By operator</div>
    ${opLabels.length===0?'<p style="color:#888;font-size:13px">No data</p>':
      opLabels.map((op,i)=>`
      <div class="row-item">
        <span>${op}</span>
        <div style="flex:1;margin:0 12px">
          <div class="prog-bar-wrap"><div class="prog-bar-fill" style="width:${opVals[i]}%;background:${barColor(opVals[i])}"></div></div>
        </div>
        <span class="pct-label ${compColor(opVals[i])}">${opVals[i]}%</span>
      </div>`).join('')}
  </div>
  <div class="section">
    <div class="section-title">By shift</div>
    ${shiftLabels.length===0?'<p style="color:#888;font-size:13px">No data</p>':
      shiftLabels.map((s,i)=>`
      <div class="row-item">
        <span>${s}</span>
        <div style="flex:1;margin:0 12px">
          <div class="prog-bar-wrap"><div class="prog-bar-fill" style="width:${shiftVals[i]}%;background:${barColor(shiftVals[i])}"></div></div>
        </div>
        <span class="pct-label ${compColor(shiftVals[i])}">${shiftVals[i]}%</span>
      </div>`).join('')}
  </div>
</div>

<div class="section" style="margin-bottom:16px">
  <div class="section-title">Compliance by operator — chart</div>
  <div class="chart-wrap" style="height:${Math.max(opLabels.length*50+60,140)}px">
    <canvas id="chart-op" role="img" aria-label="Compliance by operator"></canvas>
  </div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <div class="section">
    <div class="section-title">Most missed tasks</div>
    ${topMissed.length===0?'<p style="color:#2E7D52;font-size:13px">✓ No missed tasks</p>':
      `<table><thead><tr><th>Task</th><th style="text-align:right">Times</th></tr></thead><tbody>
      ${topMissed.map(([t,n])=>`<tr><td>${t}</td><td style="text-align:right"><span class="badge badge-notdone">${n}×</span></td></tr>`).join('')}
      </tbody></table>`}
  </div>
  <div class="section">
    <div class="section-title">Recent submissions</div>
    ${recent.length===0?'<p style="color:#888;font-size:13px">No data</p>':
      recent.map(s=>`
      <div class="row-item">
        <div>
          <div style="font-weight:500">${s.operator}</div>
          <div style="font-size:11px;color:#888">${s.day} · ${s.shift} · ${s.date}</div>
        </div>
        <span class="badge ${s.comp>=80?'badge-done':'badge-notdone'}">${Math.round(s.comp)}%</span>
      </div>`).join('')}
  </div>
</div>`;

  if(charts['op'])charts['op'].destroy();
  charts['op']=new Chart(document.getElementById('chart-op'),{
    type:'bar',
    data:{labels:opLabels,datasets:[{label:'Compliance %',data:opVals,backgroundColor:opVals.map(barColor),borderRadius:4,borderSkipped:false}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw+'%'}}},
      scales:{x:{min:0,max:100,ticks:{callback:v=>v+'%',font:{size:11}},grid:{color:'rgba(0,0,0,0.05)'}},y:{ticks:{font:{size:12}}}}}
  });
}

function applyFilter(){
  const op=document.getElementById('f-op').value;
  const sh=document.getElementById('f-shift').value;
  const day=document.getElementById('f-day').value;
  let rows=[...allRows];
  if(op) rows=rows.filter(r=>r.OPERATOR===op);
  if(sh) rows=rows.filter(r=>r.SHIFT===sh);
  if(day) rows=rows.filter(r=>r.DAY===day);
  renderAll(rows);
}

async function loadData(){
  document.getElementById('main-content').innerHTML='<div class="loading">Loading data from Google Sheets...</div>';
  try{
    const res=await fetch(API);
    const data=await res.json();
    allRows=data;
    const ops=[...new Set(data.map(r=>r.OPERATOR))];
    const days=[...new Set(data.map(r=>r.DAY))];
    document.getElementById('f-op').innerHTML='<option value="">All operators</option>'+ops.map(o=>`<option value="${o}">${o}</option>`).join('');
    document.getElementById('f-day').innerHTML='<option value="">All days</option>'+days.map(d=>`<option value="${d}">${d}</option>`).join('');
    const now=new Date().toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('last-updated').textContent='Last updated: '+now;
    renderAll(data);
  }catch(err){
    document.getElementById('main-content').innerHTML=`<div class="error-box">Could not connect to Google Sheets.<br><small>${err.message}</small></div>`;
  }
}

loadData();
</script>
</body>
</html>
